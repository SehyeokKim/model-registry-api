[project]
name = "model-registry-api"
version = "0.1.0"
description = "AutoML 플랫폼 모델 관리 API 서버"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0,<2.0",
    "fastapi>=0.142.2,<1.0",
    "jsonschema>=4.26.0,<5.0",
    "psycopg[binary]>=3.3.6,<4.0",
    "pydantic-settings>=2.15.0,<3.0",
    "sqlalchemy>=2.1.3,<2.2",
    "uvicorn>=0.54.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3.0",
    "pytest>=9.1.1,<10.0",
    # ruff는 마이너 버전마다 규칙이 바뀌므로 마이너 버전까지 고정한다.
    "ruff>=0.16.10,<0.17",
]

[tool.uv]
# 배포용 패키지가 아닌 애플리케이션이므로 프로젝트 자체는 설치하지 않는다.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit
    "PT",    # flake8-pytest-style
    "RUF",   # ruff 전용 규칙
]
# 한국어 문서와 메시지에서 범위 표기에 en dash를 쓴다.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 테스트의 assert 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
