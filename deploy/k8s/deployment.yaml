# 모델 관리 API. Pod당 uvicorn 워커 1개로 두고, 확장은 Pod 수(HPA)로 한다 (ADR 0002).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-registry-api
  labels:
    app.kubernetes.io/name: model-registry
    app.kubernetes.io/component: api
spec:
  # 초기 레플리카. 이후에는 HPA(hpa.yaml)가 2–8개 사이에서 조절한다.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: model-registry
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 Pod가 ready가 된 뒤에 이전 Pod를 내려 요청을 잃지 않는다.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-registry
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        # 이미지의 non-root 사용자(UID 10001)와 같다 (Dockerfile).
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # 배포 파이프라인이 main CI를 통과한 커밋 SHA로 바꾼다 (Publish image 워크플로).
          image: ghcr.io/sehyeokkim/model-registry-api:COMMIT_SHA
          ports:
            - name: http
              containerPort: 8000
          env:
            # DML 권한만 있는 API 계정 (마이그레이션 계정과 분리, ADR 0001)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: model-registry-db-app
                  key: database-url
          envFrom:
            - configMapRef:
                name: model-registry-config
          # liveness는 DB를 보지 않는다. DB 장애로 모든 Pod가 재시작되는 연쇄를 막는다.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness는 DB 연결까지 확인해, DB에 닿지 못하는 Pod에는 트래픽을 보내지 않는다.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Service 엔드포인트에서 빠지는 동안 들어오는 요청을 처리한 뒤 종료한다.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
