# 클러스터 내부 서비스. 외부 노출은 API Gateway가 맡는다.
# 내부 API(/internal/v1)는 Gateway 라우팅에 넣지 않고 클러스터 안의 학습 파이프라인만 호출한다.
apiVersion: v1
kind: Service
metadata:
  name: model-registry-api
  labels:
    app.kubernetes.io/name: model-registry
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-registry
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
