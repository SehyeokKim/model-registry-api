name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv.lock이 pyproject.toml과 맞지 않으면 실패한다.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.14.0 < Dockerfile

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 통합 테스트는 개발 DB와 분리된 registry_test를 쓴다 (ADR 0004).
      TEST_DATABASE_URL: postgresql+psycopg://registry:registry@localhost:5432/registry_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

  # 실제 실행 경로(`docker compose up -d`)가 깨지지 않았는지 확인한다.
  compose:
    name: Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check migrate exited successfully
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"

      - name: Check readiness
        run: curl --fail --silent --show-error http://localhost:8000/health/ready

      - name: Check demo data
        run: |
          users=$(docker compose exec -T db psql -U registry -d registry -tAc "SELECT count(*) FROM users")
          test "$users" = "4"

      - name: Call model API as demo user
        env:
          API: http://localhost:8000/api/v1/models
          DEMO_USER: 00000000-0000-0000-0000-000000000001
        run: |
          model_id=$(curl --fail --silent --show-error -X POST "$API" \
            -H "X-User-Id: $DEMO_USER" -H "Content-Type: application/json" \
            -d '{"name": "ci-smoke", "task_type": "CLASSIFICATION"}' | jq -r .id)
          curl --fail --silent --show-error "$API/$model_id" -H "X-User-Id: $DEMO_USER" \
            | jq -e '.name == "ci-smoke" and .versions == []'
          curl --fail --silent --show-error -X DELETE "$API/$model_id" -H "X-User-Id: $DEMO_USER" \
            | jq -e '.purge_at != null'

      - name: Check idempotent restart
        run: |
          docker compose up -d --wait --wait-timeout 180
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
