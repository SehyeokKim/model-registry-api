name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv.lock이 pyproject.toml과 맞지 않으면 실패한다.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.14.0 < Dockerfile

      # Kubernetes 참조 매니페스트의 스키마 검증 (문법과 필드만, 클러스터 배포는 하지 않는다)
      - name: Kubeconform
        run: >-
          docker run --rm -v "$PWD/deploy/k8s:/manifests:ro"
          ghcr.io/yannh/kubeconform:v0.8.0
          -strict -summary -kubernetes-version 1.30.0 /manifests

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 통합 테스트는 개발 DB와 분리된 registry_test를 쓴다 (ADR 0004).
      TEST_DATABASE_URL: postgresql+psycopg://registry:registry@localhost:5432/registry_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

  # 실제 실행 경로(`docker compose up -d`)가 깨지지 않았는지 확인한다.
  compose:
    name: Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check migrate exited successfully
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"

      - name: Check readiness
        run: curl --fail --silent --show-error http://localhost:8000/health/ready

      - name: Check demo data
        run: |
          users=$(docker compose exec -T db psql -U registry -d registry -tAc "SELECT count(*) FROM users")
          test "$users" = "4"

      - name: Call model API as demo user
        env:
          API: http://localhost:8000/api/v1/models
          DEMO_USER: 00000000-0000-0000-0000-000000000001
        run: |
          model_id=$(curl --fail --silent --show-error -X POST "$API" \
            -H "X-User-Id: $DEMO_USER" -H "Content-Type: application/json" \
            -d '{"name": "ci-smoke", "task_type": "CLASSIFICATION"}' | jq -r .id)
          curl --fail --silent --show-error "$API/$model_id" -H "X-User-Id: $DEMO_USER" \
            | jq -e '.name == "ci-smoke" and .versions == []'
          curl --fail --silent --show-error -X DELETE "$API/$model_id" -H "X-User-Id: $DEMO_USER" \
            | jq -e '.purge_at != null'
          curl --fail --silent --show-error "$API?status=deleted" -H "X-User-Id: $DEMO_USER" \
            | jq -e --arg id "$model_id" '[.items[].id] == [$id]'
          curl --fail --silent --show-error -X POST "$API/$model_id/restore" \
            -H "X-User-Id: $DEMO_USER" | jq -e '.name == "ci-smoke"'
          curl --fail --silent --show-error "$API" -H "X-User-Id: $DEMO_USER" \
            | jq -e --arg id "$model_id" '[.items[].id] == [$id] and .next_cursor == null'
          version=$(curl --fail --silent --show-error -X POST "$API/$model_id/versions" \
            -H "X-User-Id: $DEMO_USER" -H "Content-Type: application/json" \
            -d '{"input_schema": {"type": "object"}}')
          echo "$version" | jq -e '.version_no == 1 and .status == "PENDING"'
          echo "version_id=$(echo "$version" | jq -r .id)" >> "$GITHUB_ENV"
          echo "model_id=$model_id" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "$API" -H "X-User-Id: $DEMO_USER" \
            | jq -e '.items[0].version_count == 1 and .items[0].latest_version_no == 1'

      - name: Call internal API as ML engineer
        env:
          INTERNAL: http://localhost:8000/internal/v1/model-versions
          DEMO_USER: 00000000-0000-0000-0000-000000000001
          ML_ENGINEER: 00000000-0000-0000-0000-000000000004
        run: |
          status_url="$INTERNAL/$version_id/status"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X PATCH "$status_url" \
            -H "X-User-Id: $DEMO_USER" -H "Content-Type: application/json" \
            -d '{"status": "TRAINING"}')" = "403"
          curl --fail --silent --show-error -X PATCH "$status_url" \
            -H "X-User-Id: $ML_ENGINEER" -H "Content-Type: application/json" \
            -d '{"status": "TRAINING"}' | jq -e '.status == "TRAINING"'
          uri="s3://model-artifacts/models/$model_id/versions/$version_id/model.tar.gz"
          curl --fail --silent --show-error -X PATCH "$status_url" \
            -H "X-User-Id: $ML_ENGINEER" -H "Content-Type: application/json" \
            -d "{\"status\": \"READY\", \"artifact_uri\": \"$uri\"}" \
            | jq -e --arg uri "$uri" '.status == "READY" and .artifact_uri == $uri'

      - name: Check conditional update with ETag
        env:
          API: http://localhost:8000/api/v1/models
          DEMO_USER: 00000000-0000-0000-0000-000000000001
        run: |
          etag=$(curl --fail --silent --show-error --output /dev/null --dump-header - \
            "$API/$model_id" -H "X-User-Id: $DEMO_USER" \
            | tr -d '\r' | sed -n 's/^[Ee][Tt][Aa][Gg]: //p')
          test -n "$etag"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X PATCH \
            "$API/$model_id" -H "X-User-Id: $DEMO_USER" -H 'If-Match: "0"' \
            -H "Content-Type: application/json" -d '{"description": "stale"}')" = "412"
          curl --fail --silent --show-error -X PATCH "$API/$model_id" \
            -H "X-User-Id: $DEMO_USER" -H "If-Match: $etag" \
            -H "Content-Type: application/json" -d '{"description": "fresh"}' \
            | jq -e '.description == "fresh"'

      - name: Run purge command for expired models
        env:
          API: http://localhost:8000/api/v1/models
          DEMO_USER: 00000000-0000-0000-0000-000000000001
        run: |
          expired_id=$(curl --fail --silent --show-error -X POST "$API" \
            -H "X-User-Id: $DEMO_USER" -H "Content-Type: application/json" \
            -d '{"name": "ci-expired", "task_type": "REGRESSION"}' | jq -r .id)
          curl --fail --silent --show-error -X DELETE "$API/$expired_id" \
            -H "X-User-Id: $DEMO_USER" > /dev/null
          # 복원 기한이 지난 상태로 만든다.
          docker compose exec -T db psql -U registry -d registry -c \
            "UPDATE models SET deleted_at = now() - interval '31 days', purge_at = now() - interval '1 day' WHERE id = '$expired_id'"
          docker compose exec -T api python -m scripts.purge_expired_models --dry-run \
            | grep '"expired_count": 1'
          docker compose exec -T api python -m scripts.purge_expired_models \
            | grep '"deleted_count": 1'
          count=$(docker compose exec -T db psql -U registry -d registry -tAc \
            "SELECT count(*) FROM models WHERE id = '$expired_id'")
          test "$count" = "0"
          # 활성 모델(ci-smoke)은 남아 있어야 한다.
          curl --fail --silent --show-error "$API/$model_id" -H "X-User-Id: $DEMO_USER" > /dev/null

      - name: Check idempotent restart
        run: |
          docker compose up -d --wait --wait-timeout 180
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
