# 저장소 루트에서 `docker compose up -d` 한 번으로 DB, 마이그레이션, API를 기동한다.
# 모든 환경 변수에 기본값이 있어 .env 없이 동작한다 (목록은 .env.example).
# 기본 DB 계정과 비밀번호는 로컬 실행용이다. 운영에서는 비밀 관리 도구로 주입한다.
name: model-registry

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-registry}:${POSTGRES_PASSWORD:-registry}@db:5432/${POSTGRES_DB:-registry}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
  MODEL_RESTORE_WINDOW_DAYS: ${MODEL_RESTORE_WINDOW_DAYS:-30}
  PURGE_BATCH_SIZE: ${PURGE_BATCH_SIZE:-500}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry}
      POSTGRES_DB: ${POSTGRES_DB:-registry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 호스트에 포트를 노출하지 않는다. 로컬 테스트용 노출은 compose.dev.yaml에서만 한다.
    healthcheck:
      # TCP로 확인한다. 첫 초기화 중 임시 서버는 소켓만 열어, 소켓 확인은 준비 전에 통과할 수 있다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # 일회성 작업: 마이그레이션 후 데모 데이터 시드 (Kubernetes의 배포 전 마이그레이션 Job, ADR 0001)
  migrate:
    image: model-registry-api:local
    build: *app-build
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    environment:
      <<: *app-environment
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    # HTTP 서버가 없으므로 이미지의 HEALTHCHECK를 쓰지 않는다.
    healthcheck:
      disable: true
    restart: "no"

  api:
    image: model-registry-api:local
    build: *app-build
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # DB 연결까지 확인한다 (Kubernetes readiness probe와 같은 기준).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
