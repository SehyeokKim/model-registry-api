# Alembic configuration.
# Keep this file ASCII-only: Alembic reads it with the OS locale encoding (e.g. cp949 on Windows).
# The database URL is read from the application settings (DATABASE_URL) in migrations/env.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Prefix revision files with the creation date, e.g. 20261006_1a2b3c4d5e6f_create_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[post_write_hooks]
# Lint and format generated revision files.
hooks = ruff_check, ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
